name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - run: go test ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: python -m pip install -e "./agent[dev]"
      - run: pytest agent/tests
      - run: python -m py_compile deploy/agentcore/deploy.py deploy/agentcore/prepare_square_secret.py deploy/agentcore/seed_workspace.py deploy/agentcore/smoke.py
      - uses: docker/setup-qemu-action@v3
        if: matrix.os == 'ubuntu-latest'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
        if: matrix.os == 'ubuntu-latest'
      - name: Build AgentCore ARM64 image
        if: matrix.os == 'ubuntu-latest'
        run: docker buildx build --platform linux/arm64 -f deploy/agentcore/Dockerfile -t mise-agentcore:test --load .
      - name: Boot AgentCore image and check health contract
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker run -d --name mise-agentcore-test --platform linux/arm64 -p 8080:8080 mise-agentcore:test
          trap 'docker rm -f mise-agentcore-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ping | grep -q 'Healthy'; then
              exit 0
            fi
            sleep 1
          done
          docker logs mise-agentcore-test
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: api
      - run: npm run build
        working-directory: api
      - run: npm test
        working-directory: api
      - run: npm install
        working-directory: console
      - run: npm run build
        working-directory: console
      - run: npm test
        working-directory: console
