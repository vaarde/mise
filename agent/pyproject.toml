[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mise-agent"
version = "0.1.0"
description = "Strands runtime and safe Mise CLI boundary"
requires-python = ">=3.10"
dependencies = [
  "boto3[crt]>=1.41,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "strands-agents>=1.0",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mise_cli*", "mise_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
