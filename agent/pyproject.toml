[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mise-agent"
version = "0.1.0"
description = "Strands runtime and safe Mise CLI boundary"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mise_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
